---
openapi: 3.0.3
info:
  title: Quay crane telemetry
  version: 0.3.0
paths:
  /v1/cranes/{craneId}/load:
    get:
      summary: Current spreader load
      parameters:
        - name: craneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Load sample
          content:
            application/json:
              schema:
                type: object
                properties:
                  tonnes:
                    type: number
    post:
      summary: Record a load sample
      parameters:
        - name: craneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Recorded
