[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samedaydesk-cw06-useful-jobs"
version = "1.0.0"
description = "Pinned stdin consumer for the released SameDayDesk useful-jobs 1.4.0 Node CLI"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
cw06-useful-jobs = "cw06_useful_jobs.consumer:main"

[tool.setuptools]
packages = ["cw06_useful_jobs"]

