<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- No-FOUC: resolve the theme and paint the right ground BEFORE the React bundle (a
         deferred module) runs. Must stay inline and synchronous. -->
    <script>
      (function () {
        try {
          var KEY = "sdd-theme"; // 'dark' | 'drafting' | 'system'
          var BRAND_DEFAULT = "drafting"; // lead with the Drafting Table (light) look
          var stored = localStorage.getItem(KEY);
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme;
          if (stored === "dark" || stored === "drafting") theme = stored;
          else if (stored === "system") theme = systemDark ? "dark" : "drafting";
          else theme = BRAND_DEFAULT;
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme === "drafting" ? "light" : "dark";
          root.style.background = theme === "drafting" ? "#F4F1EA" : "#0a0b0d";
          var m = document.createElement("meta");
          m.setAttribute("name", "theme-color");
          m.setAttribute("content", theme === "drafting" ? "#F4F1EA" : "#0a0b0d");
          document.head.appendChild(m);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "drafting");
          document.documentElement.style.background = "#F4F1EA";
        }
      })();
    </script>

    <!-- Per-theme browser chrome (no-JS / system case). JS updates a non-media tag on toggle. -->
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="SameDayDesk llms.txt" />

    <title>SameDayDesk</title>
    <meta
      name="description"
      content="SameDayDesk checks what AI answers say about a business and corrects the pages those answers rest on. Fixed prices, printed refund rules, no ranking promises."
    />

    <!-- Open Graph / social preview (static, works without JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SameDayDesk" />
    <meta property="og:title" content="SameDayDesk" />
    <meta
      property="og:description"
      content="We check the answers ChatGPT, Google AI Overviews, Gemini, and Perplexity give about a business, then correct the pages those answers rest on."
    />
    <meta property="og:image" content="https://samedaydesk.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SameDayDesk" />
    <meta
      name="twitter:description"
      content="We check the answers ChatGPT, Google AI Overviews, Gemini, and Perplexity give about a business, then correct the pages those answers rest on."
    />
    <meta name="twitter:image" content="https://samedaydesk.com/og.png" />

    <!-- Fallback ground for no-JS only; the inline script above sets the live value. -->
    <style>
      html { background: #F4F1EA; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
