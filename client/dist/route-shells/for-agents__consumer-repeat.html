    <!-- No-FOUC: resolve the theme and paint the right ground BEFORE the React bundle (a
         deferred module) runs. Must stay inline and synchronous. -->
    <script>
      (function () {
        try {
          var KEY = "sdd-theme"; // 'dark' | 'drafting' | 'system'
          var BRAND_DEFAULT = "drafting"; // lead with the Drafting Table (light) look
          var stored = localStorage.getItem(KEY);
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme;
          if (stored === "dark" || stored === "drafting") theme = stored;
          else if (stored === "system") theme = systemDark ? "dark" : "drafting";
          else theme = BRAND_DEFAULT;
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme === "drafting" ? "light" : "dark";
          root.style.background = theme === "drafting" ? "#F4F1EA" : "#0a0b0d";
          var m = document.createElement("meta");
          m.setAttribute("name", "theme-color");
          m.setAttribute("content", theme === "drafting" ? "#F4F1EA" : "#0a0b0d");
          document.head.appendChild(m);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "drafting");
          document.documentElement.style.background = "#F4F1EA";
        }
      })();
    </script>

      <h2>Cold start (verify before extract)</h2>
      <pre><code>s178_consumer_repeat_acquire() {
  local origin="${S178_CONSUMER_REPEAT_ORIGIN:-${1:-https://samedaydesk.com}}"
  local bytes=718948
  local sha=04e9b6f382eedd91ae27b0d0faa68abbee7c26a1f06f52e415cb5a5884dfe05d
  local work tgz root
  work=$(mktemp -d "${TMPDIR:-/tmp}/s178-consumer-repeat.XXXXXX") || return 1
  tgz="$work/s178-consumer-repeat-kit.tgz"
  root="$work/s178-consumer-repeat-kit"
  curl -fsSL --max-time 60 -o "$tgz" "$origin/kit/s178-consumer-repeat-kit.tgz" || { rm -rf "$work"; return 1; }
  python3 -c 'import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); n=len(b); e=int(sys.argv[2]); (n==e) or sys.exit((sys.stderr.write("size %s != %s\n" % (n, e)) or 1)); h=hashlib.sha256(b).hexdigest(); (h==sys.argv[3]) or sys.exit((sys.stderr.write("sha256 %s != %s\n" % (h, sys.argv[3])) or 1))' "$tgz" "$bytes" "$sha" || { rm -rf "$work"; return 1; }
  tar -xzf "$tgz" -C "$work" || { rm -rf "$work"; return 1; }
  [ -f "$root/bin/s178-cli.mjs" ] || { rm -rf "$work"; return 1; }
  (cd "$root" && node bin/s178-cli.mjs list >&2) || { rm -rf "$work"; return 1; }
  printf '%s\n' "$root"
  return 0
}
kit=$(s178_consumer_repeat_acquire) || exit 1
printf '%s\n' "$kit"</code></pre>
