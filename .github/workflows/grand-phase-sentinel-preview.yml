name: Sentinel private paid-period and native release check

on:
  # Heavy: runs only on request (16 §4). Push and pull request events keep fast jobs only.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  private-paid-period:
    if: github.repository == 'epistemedeus/samedaydesk' && github.ref == 'refs/heads/grand-phase/redo'
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Qualify the paid period against the native matrix and private branded report
        env:
          SDS_PRIVATE_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          pg_bin="$(pg_config --bindir)"
          pg_root="$(mktemp -d)"
          "$pg_bin/initdb" -A trust -D "$pg_root/data" > "$pg_root/setup.log"
          "$pg_bin/pg_ctl" -D "$pg_root/data" -l "$pg_root/log" -o "-F -p 55473 -k $pg_root -c listen_addresses=127.0.0.1" -w start
          trap '"$pg_bin/pg_ctl" -D "$pg_root/data" -m fast -w stop' EXIT
          dsn="postgresql://$(id -un)@127.0.0.1:55473/postgres"
          psql -X -v ON_ERROR_STOP=1 "$dsn" -f supabase/migrations/0011_task_requests.sql -f supabase/migrations/0012_care_orders.sql -f supabase/migrations/0013_task_quotes.sql
          env -i PATH="$PATH" HOME="$pg_root" NODE_ENV=production SDS_PRIVATE_PREVIEW=1 SDS_CARE_DATABASE_URL="$dsn" \
            SDS_PREVIEW_MAIL_OUTBOX="$pg_root/outbox.jsonl" STRIPE_SECRET_KEY=sk_test_private_fixture \
            STRIPE_WEBHOOK_SECRET=whsec_private_fixture SDS_PRIVATE_NATIVE_SENTINEL=1 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REF_NAME="$GITHUB_REF_NAME" GITHUB_SHA="$GITHUB_SHA" SDS_PRIVATE_ACTIONS_TOKEN="$SDS_PRIVATE_ACTIONS_TOKEN" \
            node --test server/scripts/test-care-preview.mjs
