name: Grand phase SameDayDesk staging checks
on:
  push:
    branches: [grand-phase/redo]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-and-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:keep-list
      - run: npm run test:task-requests
      - run: npm run test:checkout-idempotency
      - run: npm run test:seller-repair-checkout
      - run: npm run test:verified-feed
