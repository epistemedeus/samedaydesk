name: Grand phase SameDayDesk private preview
on:
  push:
    branches: [grand-phase/redo]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-and-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Built Node app on a private runner
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" NODE_ENV=production PORT=31861 \
            SDS_PRIVATE_PREVIEW=1 SDS_PREVIEW_MAIL_OUTBOX="$RUNNER_TEMP/sds-outbox.jsonl" ADMIN_EMAIL=desk@example.test \
            SDS_RECEIPTS_SNAPSHOT_PATH="$RUNNER_TEMP/receipt-snapshot.json" node server/index.js > "$RUNNER_TEMP/sds-preview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          if ! curl --retry 12 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:31861/api/health; then
            tail -50 "$RUNNER_TEMP/sds-preview.log"
            exit 1
          fi
          for page in / /receipts /x402 /start.md; do
            curl -fsSL --max-redirs 1 "http://127.0.0.1:31861$page" -o /dev/null
          done
          node scripts/check-receipts-refresh.mjs http://127.0.0.1:31861 "$RUNNER_TEMP/receipt-snapshot.json"
          curl -fsS http://127.0.0.1:31861/api/requests -H 'Content-Type: application/json' \
            --data-binary '{"email":"buyer@example.test","task":"Review the example project and agree on scope."}' \
            | jq -e '.received and (.reference | startswith("SDD-"))'
          jq -es 'length == 2 and all(.[]; (.from | contains("@samedaydesk.com")) and (.replyTo == "contact@samedaydesk.com")) and .[0].to == "buyer@example.test" and .[1].to == "desk@example.test"' "$RUNNER_TEMP/sds-outbox.jsonl"
      - run: npm run test:keep-list
      - run: node --test scripts/receipts-route-projection.test.mjs
      - run: npm run test:task-requests
      - run: npm run test:checkout-idempotency
      - run: npm run test:seller-repair-checkout
      - run: npm run test:verified-feed
        if: success() || failure()
