name: Private homepage task profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AUDIT_PREVIEW_URL: http://127.0.0.1:31861
      AUDIT_LIVE_ORIGIN: https://samedaydesk.com
      AUDIT_CHROME: /usr/bin/google-chrome-stable
      AUDIT_SHARDS: 1
      AUDIT_SHARD: 0
      AUDIT_SCOPE: homepage-pair
      AUDIT_DIAGNOSTICS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Trace private production homepage
        run: |
          set -euo pipefail
          export AUDIT_MODULES="$RUNNER_TEMP/mobile-audit-tools"
          export AUDIT_OUTPUT="$RUNNER_TEMP/home-profile"
          npm install --prefix "$AUDIT_MODULES" --no-audit --no-fund --ignore-scripts --save-exact lighthouse@13.6.0 puppeteer-core@25.16.0
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" NODE_ENV=production PORT=31861 SDS_PRIVATE_PREVIEW=1 \
            SDS_PREVIEW_MAIL_OUTBOX="$RUNNER_TEMP/sds-home-outbox.jsonl" \
            SDS_RECEIPTS_SNAPSHOT_PATH="$RUNNER_TEMP/receipt-snapshot.json" node server/index.js > "$RUNNER_TEMP/home-preview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --retry 12 --retry-delay 1 --retry-connrefused -fsS "$AUDIT_PREVIEW_URL/api/health" -o /dev/null
          node .github/qa/mobile-performance.mjs
