name: Keep it working, Windows release check

# Installs a named npm MCP server on Windows the way a user does, runs its own self-check, starts
# it over stdio with the Claude Desktop and VS Code configurations, lists its tools and calls one
# read-only tool on a sample folder. The plain-words report is the run's artifact. It reads and
# runs only: no issue, comment or message is posted anywhere.
on:
  push:
    branches: [keep-it-working/windows-release-check]
    paths:
      - 'tools/keep-it-working/windows/**'
      - '.github/workflows/keep-it-working-windows.yml'
  workflow_dispatch:
    inputs:
      package:
        description: npm spec, as the user's configuration names it
        default: sentinel-ir-mcp@stable-0.5
      self_check:
        description: the package's own self-check arguments (empty for none)
        default: doctor --client claude-desktop
      tool:
        description: one read-only tool to call
        default: analyze_directory
      tool_args:
        description: its arguments as JSON; {folder} is the sample folder
        default: '{"path":"{folder}","max_files":10}'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release check
        shell: pwsh
        env:
          PACKAGE: ${{ inputs.package || 'sentinel-ir-mcp@stable-0.5' }}
          SELF_CHECK: ${{ inputs.self_check || 'doctor --client claude-desktop' }}
          TOOL: ${{ inputs.tool || 'analyze_directory' }}
          TOOL_ARGS: ${{ inputs.tool_args || '{"path":"{folder}","max_files":10}' }}
        run: node tools/keep-it-working/windows/stdio-release-check.mjs --package "$env:PACKAGE" --self-check "$env:SELF_CHECK" --tool "$env:TOOL" --tool-args "$env:TOOL_ARGS" --out report
      - name: Report
        if: always()
        shell: pwsh
        run: if (Test-Path report/REPORT.md) { Get-Content report/REPORT.md | Add-Content $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check-report
          path: report/
