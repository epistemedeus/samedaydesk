name: Runtime startup

on:
  pull_request:
    paths:
      - 'server/**'
      - 'client/public/llms.txt'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  push:
    branches: [main, codex/ae25-243001-hosted-export]
    paths:
      - 'server/**'
      - 'client/public/llms.txt'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-bound repair tests verify retained historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Only the root production install may supply runtime dependencies.
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run test:funnel-evidence
      - run: node --test server/scripts/test-compressed-request-parsing.js
      - run: node --test server/scripts/test-postgres-bin.mjs
      - run: npm run test:proxy-addr
      - run: node --test server/scripts/test-correspondence-startup-diagnostic.js
      - run: node --test server/scripts/test-pulse-private-metadata.js
      - run: npm run test:hosted-startup
      - run: npm run test:machine-discovery
      - run: node --test server/scripts/test-query-key-alternate.mjs
      # The selector and packet format stay tested here with fixture catalogs. Receiving a real
      # packet for a measured host is an operator step, not a check on this source.
      - name: Check source-bound acquisition selection
        run: |
          AE14_PG_BIN="$(pg_config --bindir)" \
          ROOT10940_CI_CATALOG="server/scripts/fixtures/root10940-approved-ci-packets" \
          node --test --test-concurrency=1 \
            server/scripts/test-h147010-source-bound-ci-input.mjs \
            server/scripts/test-h145010-measurement-runtime-pin.mjs
      - run: node --test server/scripts/test-machine-guide-links.js
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:pulse
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:original-task
      - run: npm run test:agent-readiness
      - run: npm run test:l08-agent-repair
      - run: npm run test:mcp
      - run: node --test server/scripts/test-public-readiness-load-failure.js
      - run: npm run test:observatory
