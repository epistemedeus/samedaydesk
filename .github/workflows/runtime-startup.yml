name: Runtime startup

on:
  pull_request:
    paths:
      - 'server/**'
      - 'client/public/llms.txt'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  push:
    branches: [main, codex/ae25-243001-hosted-export]
    paths:
      - 'server/**'
      - 'client/public/llms.txt'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-bound repair tests verify retained historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Only the root production install may supply runtime dependencies.
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --test server/scripts/test-postgres-bin.mjs
      - run: npm run test:proxy-addr
      - run: node --test server/scripts/test-correspondence-startup-diagnostic.js
      - run: npm run test:hosted-startup
      - run: npm run test:machine-discovery
      # The current consumer reads the source-bound candidate packet.
      # It does not read or write ROOT10940_CI_PACKET. The historical packet
      # stays a separate fixture and a separate refusal.
      - name: Receive the independent acquisition packet
        run: AE14_PG_BIN="$(pg_config --bindir)" node server/scripts/decode-root10940-ci-packet.mjs --packet server/scripts/fixtures/h136010-current-acquisition-packet.json
      - name: Retain the historical acquisition refusal
        run: AE14_PG_BIN="$(pg_config --bindir)" node --test --test-concurrency=1 server/scripts/test-h136010-historical-acquisition-refusal.mjs
      - run: node --test server/scripts/test-machine-guide-links.js
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:pulse
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:original-task
      - run: npm run test:agent-readiness
      - run: npm run test:l08-agent-repair
      - run: npm run test:mcp
      - run: node --test server/scripts/test-public-readiness-load-failure.js
      - run: npm run test:observatory
