name: Runtime startup

on:
  pull_request:
    paths:
      - 'server/**'
      - 'client/public/llms.txt'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  push:
    branches: [main, codex/ae25-243001-hosted-export]
    paths:
      - 'server/**'
      - 'client/public/llms.txt'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-bound repair tests verify retained historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Only the root production install may supply runtime dependencies.
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --test server/scripts/test-postgres-bin.mjs
      - run: npm run test:proxy-addr
      - run: node --test server/scripts/test-correspondence-startup-diagnostic.js
      - run: npm run test:hosted-startup
      - run: npm run test:machine-discovery
      # Each candidate selects the approved packet for its own source and
      # host fingerprints. The global ROOT10940_CI_PACKET variable remains
      # one historical input and is not current for a different fingerprint.
      # Selection stays red until Root enrolls this candidate. Do not rewrite
      # the trusted expected hash or point the variable at another fingerprint.
      - name: Check source-bound acquisition selection
        run: AE14_PG_BIN="$(pg_config --bindir)" node --test --test-concurrency=1 server/scripts/test-h147010-source-bound-ci-input.mjs
      - name: Receive the independent acquisition packet
        env:
          ROOT10940_CI_PACKET: ${{ vars.ROOT10940_CI_PACKET }}
        run: |
          set -euo pipefail
          selected="${RUNNER_TEMP}/root10940-selected-packet.json"
          enrollment="${RUNNER_TEMP}/root10940-enrollment.json"
          AE14_PG_BIN="$(pg_config --bindir)" node server/scripts/select-root10940-ci-packet.mjs \
            --catalog server/scripts/fixtures/root10940-approved-ci-packets \
            --index server/scripts/fixtures/root10940-approved-ci-packets/index.json \
            --legacy-env \
            --out "$selected" \
            --enrollment-out "$enrollment"
          AE14_PG_BIN="$(pg_config --bindir)" node server/scripts/decode-root10940-ci-packet.mjs --packet "$selected"
      - run: node --test server/scripts/test-machine-guide-links.js
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:pulse
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:original-task
      - run: npm run test:agent-readiness
      - run: npm run test:l08-agent-repair
      - run: npm run test:mcp
      - run: node --test server/scripts/test-public-readiness-load-failure.js
      - run: npm run test:observatory
