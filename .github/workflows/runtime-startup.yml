name: Runtime startup

on:
  pull_request:
    paths:
      - 'server/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  push:
    branches: [main, codex/ae25-243001-hosted-export]
    paths:
      - 'server/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-install-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Exercise the provider's npm install path too: npm ci alone did not
      # expose a linked-package version that rewrote the committed host lock.
      - name: Receive the default install without lock repair
        run: |
          npm install
          git diff --exit-code -- package-lock.json
      - name: Receive the production install without lock repair
        run: |
          NODE_ENV=production npm install
          git diff --exit-code -- package-lock.json
      - name: Exercise the source contract and refusal controls
        run: node --test server/scripts/test-resolve-contributor-source.mjs
      - name: Build through the actual managed contributor gate
        run: |
          env -u CONTRIBUTOR_JOURNEY_SOURCE_COMMIT npm run build:managed-contributor
          git diff --exit-code -- package-lock.json

  runtime-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The source-bound repair tests verify retained historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Only the root production install may supply runtime dependencies.
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run test:proxy-addr
      - run: node --test server/scripts/test-correspondence-startup-diagnostic.js
      - run: npm run test:hosted-startup
      - run: npm run test:machine-discovery
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:pulse
      - run: PULSE_PG_BIN="$(pg_config --bindir)" npm run test:original-task
      - run: npm run test:agent-readiness
      - run: npm run test:l08-agent-repair
      - run: npm run test:mcp
      - run: node --test server/scripts/test-public-readiness-load-failure.js
      - run: npm run test:observatory
