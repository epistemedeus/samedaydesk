name: Runtime startup

on:
  pull_request:
    paths:
      - 'server/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'vendor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/runtime-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:hosted-startup
