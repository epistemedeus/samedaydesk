<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neomorphic">
  <style>
    /* default = dark chrome: obsidian seal-coin */
    .bg{ fill:#0F0F12; }
    .ring{ stroke:#C2A87C; }
    .mono{ fill:#F3F1EC; }
    /* light browser chrome: flip to a parchment coin */
    @media (prefers-color-scheme: light){
      .bg{ fill:#F4F0E6; }
      .ring{ stroke:#9A7B4F; }
      .mono{ fill:#1A1714; }
    }
  </style>
  <circle class="bg" cx="32" cy="32" r="32"/>
  <circle class="ring" cx="32" cy="32" r="27"   fill="none" stroke-width="2.6"/>
  <circle class="ring" cx="32" cy="32" r="22.2" fill="none" stroke-width="1" opacity="0.5"/>
  <text class="mono" x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', 'Hoefler Text', serif"
        font-size="35" font-weight="600">N</text>
</svg>
